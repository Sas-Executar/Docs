areas:
- area_id: 1
  area_name: NEGÓCIO & GTM
  area_description: Por que o produto existe, para quem, e como se sustenta financeiramente
  source_form: EXECUTAR_projetosaasentrypoint_EXPANDIDO
  related_ecosystem_cards:
  - STR-013
  - STR-014
  - BUS-030
  - BUS-031
  - GTM-090
  fields:
  - field_id: '1.1'
    title: Problema central
    description: Descreva em 1 frase o problema que o produto resolve.
    example: 'Ex: Equipes técnicas perdem contexto entre sessões de IA e retrabalham decisões já tomadas.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.2'
    title: Público-alvo / ICP
    description: Quem é o cliente ideal — perfil, tamanho, contexto de uso.
    example: 'Ex: Founders técnicos solo ou squads pequenos construindo produtos com IA integrada.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.3'
    title: Proposta de valor
    description: O que torna esse produto a escolha óbvia frente a alternativas.
    example: 'Ex: Único agente que mantém memória estruturada entre sessões sem configuração manual.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.4'
    title: Canais de aquisição
    description: Como novos usuários vão descobrir o produto (orgânico, paid, parcerias, comunidade).
    example: 'Ex: Conteúdo técnico + comunidade de early adopters + parcerias com ferramentas complementares.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.5'
    title: Métrica North Star
    description: A métrica única que melhor representa sucesso do produto.
    example: 'Ex: Número de sessões semanais com reuso de contexto salvo.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.6'
    title: Métricas guardrail
    description: Métricas que não podem degradar enquanto a North Star sobe.
    example: 'Ex: Latência de resposta, taxa de erro em produção.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.7'
    title: CAC (custo de aquisição)
    description: Custo estimado para adquirir um cliente pagante.
    example: 'Ex: A definir após primeiro ciclo de aquisição paga.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.8'
    title: LTV (valor do tempo de vida)
    description: Valor estimado que um cliente gera ao longo do relacionamento.
    example: 'Ex: A definir com base em churn projetado.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.9'
    title: Margem por unidade/usuário
    description: Custo variável (infra, API/tokens) por usuário ativo vs. receita.
    example: 'Ex: Custo de API de IA por usuário/mês vs. preço do plano.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.10'
    title: Ponto de equilíbrio (breakeven)
    description: Quantos clientes/receita necessários para cobrir custos fixos.
    example: 'Ex: N clientes no plano X cobrem a infraestrutura base mensal.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.11'
    title: Teto de gasto de infraestrutura
    description: Limite mensal aprovado por serviço (hosting, banco, API de IA).
    example: 'Ex: Vercel $X, Supabase $X, Anthropic API $X — tetos configurados no console de cada provedor.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.12'
    title: Gatilhos de upgrade de infra
    description: Condição objetiva que dispara upgrade de plano/tier.
    example: 'Ex: Uso de API acima de 80% do teto por 3 dias consecutivos.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '1.13'
    title: Análise competitiva
    description: Concorrentes diretos/indiretos, onde diferenciamos e onde apenas empatamos.
    example: null
    origem: enriquecido_via_plugin
    plugin: product-management / marketing / sales
    skill: competitive-brief / competitive-intelligence
    valor: null
    status: pendente
  - field_id: '1.14'
    title: Dados e warehouse
    description: Onde vivem os dados de negócio (warehouse, planilha) e como são consultados/expostos
      hoje.
    example: null
    origem: enriquecido_via_plugin
    plugin: data
    skill: analyze / explore-data / sql-queries / build-dashboard
    valor: null
    status: pendente
  - field_id: '1.15'
    title: Cadência financeira recorrente
    description: Frequência e formato do fechamento financeiro (P&L, variância orçado vs. realizado).
    example: null
    origem: enriquecido_via_plugin
    plugin: finance
    skill: financial-statements / variance-analysis / close-management
    valor: null
    status: pendente
  - field_id: '1.16'
    title: Pipeline e forecast de vendas
    description: Como o pipeline comercial é acompanhado e projetado (se já existe motion de vendas).
    example: null
    origem: enriquecido_via_plugin
    plugin: sales
    skill: forecast / pipeline-review
    valor: null
    status: pendente
  field_count: 16
  area_status: pendente
- area_id: 2
  area_name: PRODUTO
  area_description: PRD, requisitos funcionais e jornada do usuário — a mesma informação em três granularidades
  source_form: EXECUTAR_projetosaasentrypoint_EXPANDIDO
  related_ecosystem_cards:
  - OFF-040
  - REQ-052
  fields:
  - field_id: '2.1'
    title: Nome do produto/feature
    description: Nome de referência usado em toda a documentação.
    example: 'Ex: EXECUTA Journal'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.2'
    title: Contexto do PRD
    description: Situação atual e por que este produto/feature é necessário agora.
    example: 'Ex: Publicação editorial hoje exige edição manual de código; produto elimina essa fricção.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.3'
    title: Objetivos (goals)
    description: O que o produto DEVE alcançar, de forma verificável.
    example: 'Ex: Permitir publicar um artigo do celular sem tocar em código.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.4'
    title: Não-objetivos (non-goals)
    description: O que está explicitamente fora de escopo, para evitar scope creep.
    example: 'Ex: Não inclui edição colaborativa multi-usuário nesta fase.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.5'
    title: Requisitos funcionais (FRD)
    description: Lista testável do que o sistema deve fazer.
    example: 'Ex: Sistema deve gerar PR automaticamente a partir de um briefing preenchido.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.6'
    title: Critérios de aceite
    description: Como se prova, de forma objetiva, que um requisito foi cumprido.
    example: 'Ex: Artigo real publicado ponta a ponta sem edição manual de TypeScript.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.7'
    title: Persona principal
    description: Quem usa o produto no dia a dia — nome fictício e papel.
    example: 'Ex: ''Marina'', editora solo que aprova publicações pelo celular.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.8'
    title: Jornada — Descoberta
    description: Como o usuário chega até o produto pela primeira vez.
    example: 'Ex: Recebe link de preview gerado automaticamente pelo pipeline.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.9'
    title: Jornada — Ativação
    description: O primeiro momento em que o usuário obtém valor real.
    example: 'Ex: Primeira publicação aprovada e no ar via QR code físico.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.10'
    title: Jornada — Uso recorrente
    description: O que traz o usuário de volta, sessão após sessão.
    example: 'Ex: Fluxo semanal de briefing → preview → aprovação.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.11'
    title: Momento 'aha'
    description: O instante exato em que o valor fica óbvio para o usuário.
    example: 'Ex: Ver o artigo publicado automaticamente após aprovar pelo celular.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.12'
    title: User story de referência
    description: 'Formato: Como [persona], quero [ação] para que [benefício].'
    example: 'Ex: Como editora solo, quero aprovar publicações pelo celular para não depender do computador.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '2.13'
    title: Exploração de problema (pré-PRD)
    description: Hipóteses já testadas ou descartadas antes de convergir no PRD atual.
    example: null
    origem: enriquecido_via_plugin
    plugin: product-management
    skill: product-brainstorming
    valor: null
    status: pendente
  field_count: 13
  area_status: pendente
- area_id: 3
  area_name: ARQUITETURA & FULL STACK
  area_description: Como as peças se conectam — front, back, banco, infra, rotas
  source_form: EXECUTAR_projetosaasentrypoint_EXPANDIDO
  related_ecosystem_cards:
  - ARC-060
  - ARC-063
  - ARC-068
  fields:
  - field_id: '3.1'
    title: Stack — Frontend
    description: Framework, biblioteca de estilo, ferramentas principais.
    example: 'Ex: Next.js + Tailwind + design tokens DESK-OS.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '3.2'
    title: Stack — Backend
    description: Runtime, linguagem, framework de servidor.
    example: 'Ex: Node.js + TypeScript, funções serverless na Vercel.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '3.3'
    title: Banco de dados
    description: Sistema, provedor, e por quê essa escolha.
    example: 'Ex: Postgres via Supabase (dados de produto) + Neon (dados serverless).'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '3.4'
    title: Infraestrutura / hosting
    description: Onde a aplicação roda e é servida.
    example: 'Ex: Vercel (apps), Supabase (auth+db), GitHub (código).'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '3.5'
    title: Autenticação
    description: Método de login e provedor.
    example: 'Ex: Supabase Auth com email/senha + OAuth Google.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '3.6'
    title: Estrutura de repositório
    description: Organização de pastas (monorepo, multi-repo, apps/packages).
    example: 'Ex: Monorepo com apps/ (web-client, orchestrator) e packages/ (core, configs).'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '3.7'
    title: Mapa de rotas principais
    description: Rotas-chave da aplicação e o que cada uma faz.
    example: 'Ex: /app/journal — editor; /health — status; /api/health — status detalhado.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '3.8'
    title: 'Decisão de arquitetura #1 (ADR)'
    description: Uma decisão técnica relevante e a alternativa descartada.
    example: 'Ex: Monorepo único em vez de múltiplos repositórios — decidido para reduzir divergência
      de versão.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '3.9'
    title: 'Decisão de arquitetura #2 (ADR)'
    description: Segunda decisão relevante, se houver.
    example: 'Ex: Origem de produção lida de variável de ambiente, nunca hardcoded.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '3.10'
    title: Trade-offs aceitos
    description: O que foi conscientemente sacrificado por outra vantagem.
    example: 'Ex: Menor flexibilidade de deploy independente em troca de consistência de versão.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '3.11'
    title: Dívida técnica conhecida
    description: O que já está identificado como dívida técnica e a prioridade de resolução.
    example: null
    origem: enriquecido_via_plugin
    plugin: engineering
    skill: tech-debt
    valor: null
    status: pendente
  field_count: 11
  area_status: pendente
- area_id: 4
  area_name: IMPLEMENTAÇÃO
  area_description: Backend, frontend, APIs, agentes integrados e dependências
  source_form: EXECUTAR_projetosaasentrypoint_EXPANDIDO
  related_ecosystem_cards:
  - REQ-051
  - REQ-052
  - VAL-081
  fields:
  - field_id: '4.1'
    title: Modelo de dados / schema
    description: Entidades principais e como se relacionam.
    example: 'Ex: users, posts, previews, publications — relacionados por post_id.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '4.2'
    title: Endpoints de API principais
    description: Lista dos endpoints mais importantes, método e função.
    example: 'Ex: POST /api/publish — dispara publicação; GET /health — status do sistema.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '4.3'
    title: Agentes/Tools MCP integrados
    description: Nome de cada agente/tool, servidor MCP e escopo de permissão.
    example: 'Ex: 11 tools EXECUTA + 10 tools Vault, servidor executar-ai canônico.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '4.4'
    title: Dependências núcleo (obrigatórias)
    description: Pacotes/serviços sem os quais o build falha.
    example: 'Ex: 6 variáveis de ambiente núcleo exigidas no build.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '4.5'
    title: Dependências condicionais
    description: Pacotes/serviços ativados apenas sob feature flag.
    example: 'Ex: Tokens Editorial E2 exigidos apenas quando EDITORIAL_E2_ENABLED=true.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '4.6'
    title: Política de atualização de dependências
    description: 'Como e quando dependências são atualizadas (ex: Dependabot).'
    example: 'Ex: PRs de risco baixo mesclados imediatamente; risco alto isolado, um de cada vez, com
      suíte de testes rodando.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '4.7'
    title: Componente frontend principal
    description: A tela/fluxo mais crítico do produto.
    example: 'Ex: Editor de Journal em /app/journal — criar, publicar, despublicar posts.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '4.8'
    title: Testes automatizados
    description: O que é coberto por CI (lint, typecheck, test, build).
    example: 'Ex: 204 testes (api) + 14 testes (web), rodando em todo PR.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '4.9'
    title: Estratégia de testes
    description: Pirâmide de testes e cobertura-alvo além do que já roda em CI hoje.
    example: null
    origem: enriquecido_via_plugin
    plugin: engineering
    skill: testing-strategy
    valor: null
    status: pendente
  field_count: 9
  area_status: pendente
- area_id: 5
  area_name: OPERAÇÃO (DEPLOY & ROLLBACK)
  area_description: O que garante que o lançamento não quebra silenciosamente
  source_form: EXECUTAR_projetosaasentrypoint_EXPANDIDO
  related_ecosystem_cards:
  - DEL-075
  - GTM-093
  fields:
  - field_id: '5.1'
    title: Checklist pré-deploy
    description: O que precisa estar verde antes de subir para produção.
    example: 'Ex: Testes passando em CI, migrations testadas, segredos configurados.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '5.2'
    title: Checks de saúde pós-deploy
    description: Endpoints/sinais verificados logo após o deploy.
    example: 'Ex: GET /health retorna status ok; rotas principais respondem 200.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '5.3'
    title: Gatilho de rollback — taxa de erro
    description: Limiar objetivo de erro que dispara rollback.
    example: 'Ex: Taxa de erro acima de 5% em 15 minutos.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '5.4'
    title: Gatilho de rollback — latência
    description: Limiar objetivo de latência que dispara rollback.
    example: 'Ex: Latência P50 acima de 800ms sustentada.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '5.5'
    title: Gatilho de rollback — fluxo crítico
    description: Qual fluxo, se falhar, exige rollback imediato.
    example: 'Ex: Fluxo de publicação (briefing → PR → preview → produção).'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '5.6'
    title: Procedimento de rollback
    description: Passo a passo de como reverter um deploy problemático.
    example: 'Ex: Reverter para o último deploy estável via painel Vercel + confirmar /health.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '5.7'
    title: Resposta a incidentes
    description: Como é feita a triagem de severidade e o postmortem depois de um incidente em produção.
    example: null
    origem: enriquecido_via_plugin
    plugin: engineering
    skill: incident-response
    valor: null
    status: pendente
  - field_id: '5.8'
    title: Gestão de mudanças
    description: Se mudanças de risco passam por um change request formal antes de ir pra produção.
    example: null
    origem: enriquecido_via_plugin
    plugin: operations
    skill: change-request
    valor: null
    status: pendente
  field_count: 8
  area_status: pendente
- area_id: 6
  area_name: GOVERNANÇA & SEGURANÇA
  area_description: Quem pode fazer o quê, onde segredos vivem, e como decisões de política são tomadas
  source_form: EXECUTAR_projetosaasentrypoint_EXPANDIDO
  related_ecosystem_cards:
  - REQ-057
  - GOV-002
  - GOV-004
  fields:
  - field_id: '6.1'
    title: Estratégia de branch
    description: Trabalho direto em main vs. PR obrigatório — e quando cada um se aplica.
    example: 'Ex: PR obrigatório para mudanças de produto; correções de config podem ir direto com aprovação.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '6.2'
    title: Gate humano obrigatório
    description: Em quais mudanças um humano precisa aprovar antes do merge/deploy.
    example: 'Ex: Toda mudança de schema de banco exige aprovação humana explícita.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '6.3'
    title: Armazenamento de segredos
    description: Onde credenciais vivem — nunca em código versionado.
    example: 'Ex: Variáveis de ambiente na Vercel, nunca em .env commitado.'
    origem: formulario_original
    valor: null
    status: pendente
  - field_id: '6.4'
