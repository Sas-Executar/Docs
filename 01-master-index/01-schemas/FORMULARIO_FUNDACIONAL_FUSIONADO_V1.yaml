schema: FORMULARIO_FUNDACIONAL_FUSIONADO_V1
language: pt-BR
description: 'Fusão dos dois documentos fundacionais (EXECUTAR_projetosaasentrypoint_EXPANDIDO, 94 campos
  / 17 domínios, e ECOSYSTEM_MASTER_YAML_CARDS_V1, 75 cards / 12 fases) enriquecida com tópicos reais
  lidos nos SKILL.md do vendor anthropic-knowledge-work-plugins (Regra Zero do Maestro): cada campo com
  origem "enriquecido_via_plugin" cita plugin e skill de origem. Nenhum tópico de plugin foi incluído
  sem leitura do SKILL.md correspondente.'
sources:
- 01-master-index/01-schemas/EXECUTAR_projetosaasentrypoint_EXPANDIDO.schema.json
- 01-master-index/01-schemas/ECOSYSTEM_MASTER_YAML_CARDS_V1.yaml
- 80-tecnologia-plataformas/05-gpt/03-skills/anthropic-knowledge-work-plugins
fill_protocol:
  rule: O usuário escolhe (ou aceita a ordem já confirmada de) um grupo de áreas, coleta os documentos
    locais relevantes e envia. O Maestro extrai as respostas, preenche `valor` e muda `status` para `preenchido`
    ou `parcial`, registrando proveniência e lacunas quando houver. Nenhuma área é preenchida sem material
    enviado pelo usuário.
  field_status_values:
  - pendente
  - preenchido
  - parcial
  - lacuna
  - hipotese
  - conflito
  - nao_aplicavel
  area_status_values:
  - pendente
  - em_andamento
  - completo
  field_origem_values:
  - formulario_original
  - enriquecido_via_plugin
  tipo_informacao_values:
  - fato_interno
  - evidencia_externa
  - inferencia
  - hipotese
  - decisao
  - recomendacao
  confianca_values:
  - alta
  - media
  - baixa
  rastreabilidade: Conforme Basedocumental310826.md §07-Output Requirements (OUT-08 status, OUT-09 tipo
    de informação, OUT-10 fonte primária, OUT-12 evidência, OUT-15 confiança, OUT-17 lacuna específica
    em vez de TBD, OUT-24 próxima ação).
