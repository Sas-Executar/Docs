  - field_id: '2.11'
    title: Momento 'aha'
    description: O instante exato em que o valor fica óbvio para o usuário.
    example: 'Ex: Ver o artigo publicado automaticamente após aprovar pelo celular.'
    origem: formulario_original
    valor: 'Nenhum documento usa a expressão “momento aha”. O equivalente funcional canônico é o VALUE_EVENT-01
      — “Projeto real → contexto interpretado → próxima ação válida → ação executada → conclusão/evidência
      registrada” —, definido como o evento que caracteriza valor entregue e que governa o gate de PMF.
      As cenas de demonstração que materializam esse momento são: Cena A do app — “‘Tenho 30 minutos.’
      Mostrar o sistema reduzindo um projeto complexo à próxima ação possível”; Cena B — “Alterar uma
      condição do dia e mostrar plano preservado + rota recalculada”; e o loop do Agente 007 — “/bomdia
      → reconstruir estado → mostrar trabalho atual”. A frase de posicionamento que descreve o momento:
      “Você não precisa reorganizar o projeto toda vez que o dia muda. O sistema recalcula a rota e mostra
      o próximo passo possível.” A mensagem correspondente é “O plano continua. A rota se adapta. Você
      executa.”'
