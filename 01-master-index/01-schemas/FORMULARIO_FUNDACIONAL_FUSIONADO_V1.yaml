  - field_id: '2.13'
    title: Exploração de problema (pré-PRD)
    description: Hipóteses já testadas ou descartadas antes de convergir no PRD atual.
    example: null
    origem: enriquecido_via_plugin
    plugin: product-management
    skill: product-brainstorming
    valor: 'A exploração de problema pré-PRD é a parte mais desenvolvida de toda a Área 2, e existe em
      quatro artefatos. (a) DATA-ADHD-PM-001 — matriz GP-01…GP-11: para cada função de gestão de projetos,
      mapeia capacidade exigida → vulnerabilidade associada → classe de evidência (B/C/E) → impacto operacional
      → compensação sistêmica → decisão de produto, com fonte clínica e científica por linha. (b) Os 28
      pontos reorganizados como cadeia progressiva “fundamento → problema humano → efeito → compensação
      → sistema → produto → validação”. (c) Framework de 694 perguntas com cobertura analítica: 248 RAW,
      116 knowledge, 161 evidence candidates, 0 strict VERIFIED, 28 vínculos diretos candidatos, 484 vínculos
      temáticos, 182 perguntas sem evidência — do qual derivam as 22 decisões operacionais. (d) Mapa de
      pesquisa e prior art do ECO-03: o que já existe, whitespace provisório, guardrail e seis strings
      de busca sugeridas (A a F). O corpus separa explicitamente evidência publicada de inferência, com
      o invariante “original ≠ extração ≠ evidência ≠ decisão”.'
    status: preenchido
    tipo_informacao: fato_interno
    confianca: alta
    eco_unit: TRANSVERSAL — ECO-01 e ECO-03
    documento_ids:
    - DOC-C07-010
    - DOC-C07-002
    - DOC-C07-003
    - DOC-C05-001
    - DOC-C07-009
    - DOC-C02-031
    - DOC-C01-005
    evidencia: 'DOC-C07-010 (3P+N): “Progresso — A hipótese central é parcialmente sustentada: há convergência
      forte para organização, planejamento, gestão temporal, atenção sustentada e conclusão; evidência
      moderada para memória prospectiva, flexibilidade e metacognição”; “Next 01 Transformar a matriz
      abaixo em requisitos funcionais e princípios de design verificáveis.” | DOC-C07-002 e DOC-C07-003:
      11 linhas GP-01…GP-11 com colunas Função de gestão · Capacidade exigida · Vulnerabilidade associada
      · Evidência · Impacto operacional · Compensação sistêmica · Decisão de produto/design. | DOC-C07-009
      (kpis): “questions_694: 694 · candidate_direct_links: 28 · thematic_links: 484 · no_evidence: 182
      · operational_decisions: 22 · strict_verified: 0.” | DOC-C02-031 (item 3, WHITESPACE PROVISÓRIO):
      “perfil executivo individual → demanda cognitiva da tarefa → evento provável de falha → probabilidade/impacto
      → controle compensatório → evidência de execução.”'
    fonte_primaria: Base documental C01–C18 · 214 arquivos validados por SHA-256 · DOCUMENTOS.zip recebido
      em 31/08/2026
    lacuna: 182 das 694 perguntas continuam sem evidência e o gate estrito registra 0 VERIFIED — a exploração
      é ampla, mas nenhum vínculo está formalmente verificado.
    proxima_acao: Fechar o gate factual pelo menos das evidências que sustentam as 15 decisões PROD-01…PROD-15,
      hoje todas classificadas como DECISION_DERIVED_FROM_CANDIDATE_EVIDENCE.
