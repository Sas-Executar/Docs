  - field_id: '2.12'
    title: User story de referência
    description: 'Formato: Como [persona], quero [ação] para que [benefício].'
    example: 'Ex: Como editora solo, quero aprovar publicações pelo celular para não depender do computador.'
    origem: formulario_original
    valor: 'Não existe user story em formato canônico (“Como <persona>, quero <ação>, para <benefício>”)
      em nenhum dos documentos lidos — a busca por “user story” e por padrões “Como … quero …” nos 214
      arquivos não retorna ocorrências. O que existe são três declarações em primeira pessoa registradas
      como “Perspectiva do usuário” no workbook, que cumprem a mesma função. (1) Público: “Quero começar
      o dia, semana, mês de trabalho executando as tarefas sem, ao mesmo tempo, me preocupar com a ordem
      e controle da progressão.” (2) Problema: “Perco dinheiro e oportunidades por atrasos e desorganização.
      Quando consigo terminar aquilo que foi planejado, o custo emocional e cognitivo é tão alto que não
      faço mais nada. O momento de maior ansiedade e aflição são os primeiros 30 minutos iniciais, pois
      não sei onde estava ontem, o que devo fazer agora e como sei que terminei.” (3) Categoria: “Esse
      app me entende e foi desenhado para mim e organiza tudo para mim de forma confiável e com metodologias
      válidas.” A declaração (2) é a mais utilizável como story de referência porque nomeia gatilho (retomada),
      momento (primeiros 30 minutos) e as três perguntas do usuário — onde parei, o que faço agora, como
      sei que terminei — que mapeiam diretamente nos requisitos de contexto persistente, próxima ação
      e DoD verificável.'
    status: parcial
    tipo_informacao: fato_interno
    confianca: media
    eco_unit: ECO-01
    documento_ids:
    - DOC-C05-001
    - DOC-C11-004
    evidencia: 'DOC-C05-001 (Corpo, linha Problema, Perspectiva do usuário): “Perco dinheiro e oportunidades
      por atrasos e desorganização. […] O momento de maior ansiedade e aflição são os primeiros 30 minutos
      iniciais, pois não sei onde estava ontem, o que devo fazer agora e como sei que terminei.” | DOC-C05-001
      (Corpo, linha Público): “Quero começar o dia, semana, mês de trabalho executando as tarefas sem,
