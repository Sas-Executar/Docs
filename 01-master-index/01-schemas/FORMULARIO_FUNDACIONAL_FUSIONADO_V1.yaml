areas:
- area_id: 1
  area_name: NEGÓCIO & GTM
  area_description: Por que o produto existe, para quem, e como se sustenta financeiramente
  source_form: EXECUTAR_projetosaasentrypoint_EXPANDIDO
  related_ecosystem_cards:
  - STR-013
  - STR-014
  - BUS-030
  - BUS-031
  - GTM-090
  fields:
  - field_id: '1.1'
    title: Problema central
    description: Descreva em 1 frase o problema que o produto resolve.
    example: 'Ex: Equipes técnicas perdem contexto entre sessões de IA e retrabalham decisões já tomadas.'
    origem: formulario_original
    valor: 'O problema aparece em três camadas distintas, por unidade. (a) ECO-01 App EXECUTAR — problema
      operacional: “Paralisia por excesso, dificuldade de iniciação das tarefas, não linearidade de execução,
      troca de contexto cognitivo, retrabalho por não respeitar cadeia única de valor e dependências,
      memória de trabalho limitada, ausência de processos padronizados e múltiplas fontes de execução
      e plataformas”. A decisão PROD-03 refina: a dor central é “dificuldade de transformar intenção em
      comportamento organizado ao longo do tempo”, evitando o posicionamento genérico de “produtividade”;
      PROD-06 define o problema observável prioritário como a combinação planejamento + memória + tempo
      + procrastinação. (b) ECO-03 Framework/CERM — problema conceitual: “A distância entre intenção e
      execução diante de vulnerabilidades cognitivas e demandas reais”; o documento adverte explicitamente
      para NÃO usar “não execução” como problema principal, por ser estreito demais. (c) ECO-02 Blog Risco
      Cognitivo — problema estratégico do lançamento editorial: “Apresentar o EXECUTAR cedo demais pode
      reduzir a credibilidade da investigação e impedir distinguir interesse genuíno pelo problema de
      interesse no produto”.'
    status: preenchido
    tipo_informacao: fato_interno
    confianca: alta
    eco_unit: TRANSVERSAL (detalhado por ECO-01, ECO-03 e ECO-02)
    documento_ids:
    - DOC-C05-001
    - DOC-C07-009
    - DOC-C01-005
    - DOC-C02-039
    - DOC-C07-002
    - DOC-C07-010
    evidencia: 'DOC-C05-001 (seção “Corpo”, linha Problema): “Paralisia por excesso, dificuldade de iniciação
      das tarefas, não linearidade de execução, troca de contexto cognitivo, retrabalho por não respeitar
      cadeia única de valor e dependências, memória de trabalho limitada, ausência de processos padronizados
      e múltiplas fontes de execução e plataformas.” Perspectiva do usuário no mesmo documento: “Perco
      dinheiro e oportunidades por atrasos e desorganização. […] O momento de maior ansiedade e aflição
      são os primeiros 30 minutos iniciais, pois não sei onde estava ontem, o que devo fazer agora e como
      sei que terminei.” | DOC-C07-009 (decisão PROD-03): “Definir a dor central como dificuldade de transformar
      intenção em comportamento organizado ao longo do tempo, evitando o posicionamento genérico de ‘produtividade’.”
      | DOC-C01-005: “Eu evitaria usar não execução como problema principal. É estreito demais.” e “A
      distância entre intenção e execução diante de vulnerabilidades cognitivas e demandas reais.” | DOC-C02-039
      (BMC, célula Problema): “Apresentar o EXECUTAR cedo demais pode reduzir a credibilidade da investigação
      e impedir distinguir interesse genuíno pelo problema de interesse no produto.”'
    fonte_primaria: Base documental C01–C18 · 214 arquivos validados por SHA-256 · DOCUMENTOS.zip recebido
      em 31/08/2026
    lacuna: ''
    proxima_acao: Registrar no formulário um enunciado de problema por unidade, em vez de fundir as três
      camadas num único texto.
  - field_id: '1.2'
    title: Público-alvo / ICP
    description: Quem é o cliente ideal — perfil, tamanho, contexto de uso.
    example: 'Ex: Founders técnicos solo ou squads pequenos construindo produtos com IA integrada.'
    origem: formulario_original
    valor: 'CONFLITO ENTRE DOCUMENTOS. Versão A (DOC-C05-001, workbook Sas-06, seção Público): “Homens,
      adultos, neurodivergentes, autônomos, na faixa dos 25–35 anos, recém-diagnosticados, que gerenciam
      múltiplos processos e projetos ao mesmo tempo. Têm consciência básica de terminologia e funções
      executivas, já utilizaram e abandonaram outros aplicativos por não manterem o uso e rejeitam alta
      complexidade de configuração.” Versão B (DOC-C07-009, decisão ICP-01 / achado ICP-HYP-01, 15/08/2026):
      “Profissional independente/solo brasileiro, aproximadamente 25–44 anos, multiprojeto, que perde
      contexto, tem dificuldade recorrente para escolher próxima ação, já tentou ferramentas de produtividade
      e controla/influencia a própria compra”, com ressalva explícita de que diagnóstico de TDAH NÃO é
      critério de entrada. As duas versões divergem em faixa etária (25–35 × 25–44), gênero (homens ×
      não especificado) e no papel da neurodivergência/diagnóstico como critério de ICP. Unidades com
      público próprio já declarado: ECO-07 Estúdio — “Profissionais solo, autônomos e pequenos negócios
      com trabalho, informação, clientes e projetos dispersos”; ECO-02 Blog — “Leitores interessados em
      funções executivas, neurodivergência, trabalho, projetos e risco; especialistas entram como crítica
      externa, não como endosso.”'
    status: conflito
    tipo_informacao: decisao
    confianca: alta
    eco_unit: TRANSVERSAL — conflito em ECO-01; ECO-07 e ECO-02 têm públicos próprios
    documento_ids:
    - DOC-C05-001
    - DOC-C07-009
    - DOC-C02-039
    evidencia: 'DOC-C05-001: “Homens, adultos, neurodivergentes, autônomos, na faixa dos 25–35 anos, recém-diagnosticados…”
      | DOC-C07-009 (ICP-01, status DECIDED_FOR_TEST, confiança MÉDIA-ALTA): “Iniciar testes por profissionais
      independentes multiprojeto, sem exigir diagnóstico de TDAH”; e “O que não é critério de entrada:
      Diagnóstico de TDAH. Diagnóstico/autodeclaração deve ser variável opcional posterior, especialmente
      porque dados de saúde são sensíveis e não são necessários para o core funcional.” | DOC-C05-001
      (SSOT Executar Studio, item 02 Público): “Profissionais solo, autônomos e pequenos negócios com
      trabalho, informação, clientes e projetos dispersos.” | DOC-C02-039 (BMC, Público/validação): “Leitores
      interessados em funções executivas, neurodivergência, trabalho, projetos e risco.”'
    fonte_primaria: Base documental C01–C18 · 214 arquivos validados por SHA-256 · DOCUMENTOS.zip recebido
      em 31/08/2026
    lacuna: Não há registro de qual definição prevalece nem data de supersessão. DOC-C07-009 é de 15/08/2026
      e classifica o ICP como hipótese de classe E a validar; DOC-C05-001 não traz data própria de decisão.
      Faltaria um ADR comercial ou nota de decisão datada.
    proxima_acao: Decidir explicitamente qual ICP vale para o lançamento de 07/09 e arquivar a versão
      superada com data e justificativa.
  - field_id: '1.3'
    title: Proposta de valor
    description: O que torna esse produto a escolha óbvia frente a alternativas.
    example: 'Ex: Único agente que mantém memória estruturada entre sessões sem configuração manual.'
    origem: formulario_original
    valor: 'Proposta de valor por unidade. ECO-01 App: “Criar uma situação em que a execução do que foi
      planejado aconteça com o mínimo possível de carga administrativa e cognitiva sobre o usuário. O
      sistema assume parte da estrutura, organização e priorização”; promessa: “Zero configuração, mínimo
      de personalização, uso mínimo do app — cerca de 1–2 vezes por semana — e externalização cognitiva”;
      mensagem de sustentação: “Você executa. O sistema sustenta a execução.”; headline canônica: “O app
      de produtividade feito para você não usar.” Posicionamento resultante (DOC-C07-009): “Sistema de
      execução para profissionais multiprojeto que transforma contexto em próxima ação e preserva o estado
      do trabalho — neurocompatível por design, mas não apresentado como tratamento de TDAH.” ECO-07 Estúdio:
      “Traga o problema. Em 7 dias, saia com um sistema funcionando”; “Menos tempo organizando a operação.
      Mais clareza sobre o que fazer, onde encontrar e como repetir.” ECO-02/ECO-03: “Transformar Risco
      Cognitivo em uma categoria editorial e investigável antes de conectá-la ao produto.” ECO-05 Infoprodutos:
      “Livros digitais funcionam como produto de entrada e aplicação. Curso funciona como aplicação guiada.”
      ECO-04 Físicos: “Neurobook = planejar e registrar → Timer = executar → Organização = reduzir decisões
      cotidianas → Office Kit = sistema integrado.”'
    status: preenchido
    tipo_informacao: fato_interno
    confianca: alta
    eco_unit: TRANSVERSAL — respostas distintas em ECO-01, ECO-07, ECO-02/03, ECO-05 e ECO-04
    documento_ids:
    - DOC-C05-001
    - DOC-C07-009
    - DOC-C09-004
    - DOC-C09-006
    - DOC-C09-016
    - DOC-C09-008
    - DOC-C02-039
    evidencia: 'DOC-C05-001 (Benefício e Promessa principal; Mensagem final): “O usuário executa. O sistema
      sustenta a execução.”; Headline 01: “O app de produtividade feito para você não usar.”; Descrição
      01: “Executar é um sistema de gestão de projetos orientado à execução que reduz configuração, organização
      manual e decisões repetitivas para mostrar o que pode ser feito agora.” | DOC-C07-009 (campo positioning):
      “Sistema de execução para profissionais multiprojeto que transforma contexto em próxima ação e preserva
      o estado do trabalho.” | DOC-C09-004: “O aplicativo de produtividade feito para você usar menos.
      O sistema sustenta a estrutura; o usuário executa.” | DOC-C09-006: “Traga o problema. Em 7 dias,
      saia com um sistema funcionando.” | DOC-C02-039 (BMC, Proposta de valor): “Transformar Risco Cognitivo
      em uma categoria editorial e investigável antes de conectá-la ao produto.”'
    fonte_primaria: Base documental C01–C18 · 214 arquivos validados por SHA-256 · DOCUMENTOS.zip recebido
      em 31/08/2026
    lacuna: ''
    proxima_acao: ''
  - field_id: '1.4'
    title: Canais de aquisição
    description: Como novos usuários vão descobrir o produto (orgânico, paid, parcerias, comunidade).
    example: 'Ex: Conteúdo técnico + comunidade de early adopters + parcerias com ferramentas complementares.'
    origem: formulario_original
    valor: 'Arquitetura de canais em dois níveis (DOC-C05-001). OWNED: 01 executar.com/Blog (fonte canônica
      do conteúdo); 02 Biblioteca Executar (indexação permanente, guias, referências, e-books); 03 e-mail/newsletter;
      04 comunidade futura. DISTRIBUIÇÃO (plataformas alugadas/terceiras): YouTube (explicação + demonstração
      + descoberta), Instagram (carrossel, visual, Reels), TikTok (descoberta, vídeos curtos), LinkedIn
      (gestão, operações, risco, conteúdo técnico). Regra de produção “uma fonte, vários outputs”: questão
      editorial → pesquisa → artigo canônico → diagrama/infográfico → vídeo principal → 2–4 shorts → carrossel
      → post LinkedIn → newsletter → entrada na Biblioteca → trecho no e-book/curso → CTA de aprofundamento.
      Canais comerciais: Hotmart (infoprodutos, com cadastro e checkout), afiliados (Barkley ×2 e Ana
      Beatriz Barbosa Silva), loja própria, formulário visual do Estúdio. Aquisição do ECO-07: “Conteúdo
      → Showroom → Formulário visual → Encontro → Projeto”. Operacionalmente, os canais estão registrados
      como 10 chamadas CH-001…CH-010 com destino e estado (DOC-C08-004) e 10 rotas RT-001…RT-010 (DOC-C08-006).
      Para ECO-02, o canal inaugural é o pacote de 18 ativos em 14 dias: 1 artigo, 1 newsletter, 1 vídeo
      principal, 3 vídeos curtos, 2 carrosséis, 6 posts curtos, 1 infográfico, 1 checklist, 1 lead magnet
      e 1 landing page.'
    status: preenchido
    tipo_informacao: decisao
    confianca: alta
    eco_unit: TRANSVERSAL
    documento_ids:
    - DOC-C05-001
    - DOC-C08-004
    - DOC-C08-006
    - DOC-C06-001
    - DOC-C02-043
    - DOC-C09-015
    - DOC-C09-018
    - DOC-C12-004
    evidencia: 'DOC-C05-001 (Arquitetura das plataformas): “OWNED 01 executar.com / Blog — Fonte canônica
      do conteúdo; OWNED 02 Biblioteca Executar; OWNED 03 E-mail / newsletter; DISTRIBUIÇÃO 01 YouTube;
      02 Instagram; 03 TikTok; 04 LinkedIn”; e “Instagram, YouTube, TikTok e LinkedIn não são plataformas
      proprietárias; são plataformas alugadas/terceiras.” | DOC-C05-001 (SSOT Studio, item 13 Aquisição):
      “Conteúdo → Showroom → Formulário visual → Encontro → Projeto.” | DOC-C08-004: “CH-001 Experimentar
      Executar → página do aplicativo”, “CH-003 Explorar a biblioteca”, “CH-007 Ver o livro → ligação
      de afiliado”, “CH-010 Entrar na lista → formulário”. | DOC-C02-043: “Pacote: 1 artigo, 1 newsletter,
      1 vídeo principal, 3 vídeos curtos, 2 carrosséis, 6 posts curtos, 1 infográfico, 1 checklist, 1
      lead magnet e 1 landing page — 18 ativos principais.” | DOC-C09-018: “Núcleo inicial — Russell A.
      Barkley · Vencendo o TDAH Adulto; Russell A. Barkley · Executive Functions; Ana Beatriz Barbosa
      Silva · Mentes Inquietas.”'
    fonte_primaria: Base documental C01–C18 · 214 arquivos validados por SHA-256 · DOCUMENTOS.zip recebido
      em 31/08/2026
    lacuna: Nenhum documento define mídia paga, verba por canal ou meta de tráfego. A aquisição paga só
      aparece implicitamente, como pressuposto do guardrail de CAC em DOC-C07-009.
    proxima_acao: Decidir se haverá mídia paga no lançamento de 07/09 e, em caso afirmativo, registrar
      acquisition_source e campaign_id por canal — eventos já especificados na telemetria de DOC-C07-009.
  - field_id: '1.5'
    title: Métrica North Star
    description: A métrica única que melhor representa sucesso do produto.
    example: 'Ex: Número de sessões semanais com reuso de contexto salvo.'
    origem: formulario_original
    valor: 'Nenhum documento nomeia uma “métrica North Star”. O candidato canônico mais próximo é o VALUE_EVENT-01
      da telemetria do EXECUTAR: “Projeto real → contexto interpretado → próxima ação válida → ação executada
      → conclusão/evidência registrada” — o evento que define valor entregue e que governa ativação, PMF
      e coortes W1/W2/W4/W8. Os endpoints de eficácia funcional associados são time_to_next_action, resume_latency,
      completion_rate, context_reconstruction, execution_cycles_per_week e abandonment_rate. Para ECO-02,
      a meta declarada é de output, não de outcome: “publicar 18 ativos em 14 dias, com artigo dentro
      de 1.200–1.800 palavras”, capturando baseline de visualizações, retenção, salvamentos, inscrições
      e downloads — com a regra explícita de “não estabelecer ainda metas arbitrárias de seguidores ou
      leads sem baseline”. O BMC do ECO-02 registra literalmente “% geral não informado” e “métricas não
      informadas permanecem desconhecidas”.'
    status: parcial
    tipo_informacao: inferencia
    confianca: media
    eco_unit: ECO-01 (candidato VALUE_EVENT-01) e ECO-02 (meta de output)
    documento_ids:
    - DOC-C07-009
    - DOC-C02-043
    - DOC-C02-039
    - DOC-C16-003
    - DOC-C16-006
    evidencia: 'DOC-C07-009 (objeto telemetry): “value_event_01: Projeto real → contexto interpretado
      → próxima ação válida → ação executada → conclusão/evidência registrada”; “functional_efficacy_endpoints:
      time_to_next_action, resume_latency, completion_rate, context_reconstruction, execution_cycles_per_week,
      abandonment_rate.” | DOC-C02-043 (Objetivo SMART da primeira fase): “Mensurável: publicar 18 ativos
      em 14 dias, com artigo dentro de 1.200–1.800 palavras”; “Não estabelecer ainda metas arbitrárias
      de seguidores ou leads sem baseline.” | DOC-C02-039 (rodapé do BMC): “métricas não informadas permanecem
      desconhecidas”. | DOC-C16-003 (MED-001) lista apenas o que verificar (chamada→destino, formulário→recebimento,
      download→arquivo), sem métrica-alvo.'
    fonte_primaria: Base documental C01–C18 · 214 arquivos validados por SHA-256 · DOCUMENTOS.zip recebido
      em 31/08/2026
    lacuna: Falta a eleição formal de UMA métrica North Star com definição, fórmula, janela de medição
      e meta. O artefato estaria num documento de métricas/analytics ou num ADR de produto — inexistente
      no corpus.
    proxima_acao: Eleger “VALUE_EVENT-01 concluídos por usuário ativo por semana” como NSM candidata e
      fixar baseline após o piloto de ≥40 usuários previsto em PMF-01.
  - field_id: '1.6'
    title: Métricas guardrail
    description: Métricas que não podem degradar enquanto a North Star sobe.
    example: 'Ex: Latência de resposta, taxa de erro em produção.'
    origem: formulario_original
    valor: 'Guardrails existentes, por domínio. (a) Econômico — CAC-01: TARGET-CAC provisório ≤ R$70 e
      alerta/limite de aproximadamente R$95 até existir CAC observado. (b) Regulatório e de comunicação
      — CLAIM-01, PROD-14 e PROD-15: claims proibidos hoje são “Reduz sintomas de TDAH”, “Melhora função
      executiva clinicamente”, “Trata TDAH”, “Diagnostica ou identifica TDAH”, “Substitui terapia, tratamento
      ou medicação” e “Cientificamente comprovado para TDAH”; e é bloqueado qualquer uso do produto como
      diagnóstico, substituição profissional ou inferência clínica. (c) Gate de PMF — PMF-01: só declarar
      PMF com convergência de VALUE_EVENT-01, coortes W1/W2/W4/W8, pagamento/renovação e pesquisa de dependência,
      com heurística n ≥ 40 qualificados e > 40% “muito desapontados”. (d) Operacional de lançamento:
      “Broken links = 0”, “backlog crítico = 0”, “não existe entrega crítica aguardando produção”. (e)
      Epistemológico — invariantes: “original ≠ extração ≠ evidência ≠ decisão · candidate ≠ verified
      · benchmark ≠ dado do EXECUTAR · modelo econômico ≠ unit economics observado · literatura externa
      ≠ eficácia do EXECUTAR · similaridade ≠ suporte factual”.'
    status: preenchido
    tipo_informacao: decisao
    confianca: alta
    eco_unit: TRANSVERSAL — econômico e de claims em ECO-01; operacional no GTM 07/09
    documento_ids:
    - DOC-C07-009
    - DOC-C06-001
    - DOC-C08-007
    evidencia: 'DOC-C07-009 (CAC-01): “Usar TARGET-CAC provisório ≤ R$70 e alerta/limite de aproximadamente
      R$95 até existir CAC observado.” | DOC-C07-009 (claims_policy.prohibited_now): lista literal dos
      seis claims proibidos. | DOC-C07-009 (Invariantes): “modelo econômico ≠ unit economics observado”.
      | DOC-C06-001 (D11, DoD do dia): “Broken links = 0; fluxo de conversão testado”; D12: “Tudo agendado;
      backlog crítico = 0; GTM READY.” | DOC-C08-007: “não existe entrega crítica aguardando produção.”'
    fonte_primaria: Base documental C01–C18 · 214 arquivos validados por SHA-256 · DOCUMENTOS.zip recebido
      em 31/08/2026
    lacuna: Não há guardrail técnico de produto nesta área (taxa de erro, latência, custo de IA por usuário).
      O evento variable_ai_cost é coletado na especificação de telemetria, mas sem limiar definido.
    proxima_acao: Definir limite para variable_ai_cost por usuário ativo, já que o evento está previsto
      mas não tem teto declarado.
  - field_id: '1.7'
