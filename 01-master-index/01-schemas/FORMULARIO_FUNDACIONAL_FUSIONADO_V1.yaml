    origem: formulario_original
    valor: 'A jornada de descoberta está desenhada para os eixos editorial e de serviços, não para o app.
      Editorial (ECO-02): a descoberta é governada por níveis de consciência — “Não consciente → consciente
      do problema → consciente das soluções → consciente do método → pronto para agir” — com CTA correspondente
      por nível (“Baixa consciência: não empurre Produto; CTA ideal ‘Entenda o que está acontecendo’”;
      “Alta intenção: não empurre mais teoria; CTA ‘Experimentar Executar / conhecer Studio’”). O artigo
      canônico é a peça-mãe e cada peça segue a narrativa “CENA → PROBLEMA → MECANISMO → EVIDÊNCIA → MODELO
      → APLICAÇÃO → DEMONSTRAÇÃO → PRÓXIMO PASSO”. A campanha inaugural do ECO-02 vai de D1 (artigo +
      landing) a D14 (síntese + CTA editorial), com CTA “ler, explorar, assinar e baixar o Mapa de Risco
      Cognitivo” e o produto deliberadamente em segundo plano. Serviços (ECO-07): “Conteúdo → Showroom
      → Formulário visual → Encontro → Projeto”, com regra de showroom “Problema → entrada real → transformação
      → resultado → prova → CTA”. Porta de entrada de captação: brinde canônico BRINDE-001/GIFT-001, com
      cadeia “asset → capa → landing → formulário → confirmação → entrega/download → CTA → tracking →
      evidence”.'
    status: parcial
    tipo_informacao: decisao
    confianca: media
    eco_unit: ECO-02 e ECO-07 documentadas; ECO-01 sem jornada de descoberta própria
    documento_ids:
