instrumentos:
  origem: Basedocumental310826.md (31/08/2026) — §02-Preenchimento e §07-Output Requirements
  nota: 'A base documental expande o escopo: o formulário fundido de 17 áreas/122 campos passa a ser UM
    de cinco instrumentos a preencher, e cada um deve ser preenchido por unidade de análise (8 áreas ECO),
    não uma única vez.'
  lista:
  - id: INS-01
    nome: XLS Projeto Entrypoint Expandido (formulário fundido)
    ids: 17 áreas / 122 campos (94 originais + 28 de plugin)
    estado: dia 1 preenchido parcialmente (áreas 8, 9, 10)
    conflito: 'OUT-33 da base documental exige apenas 1.1–1.12, 8.1–8.5, 9.1–9.4, 10.1–10.4, 12.1–12.3,
      14.1–14.3, 16.1–16.3 (34 campos). O formulário fundido tem 122. Pendente decisão do owner: preencher
      os 122 ou apenas os 34 do escopo OUT-33.'
  - id: INS-02
    nome: Project Charter PMBOK 8
    ids: PC-01, PC-02, PC-03, PC-04, PC-05A, PC-05B, PC-05C, PC-07
    estado: não recebido
    conflito: Instrumento ainda não enviado — só a instrução de preenchimento chegou.
  - id: INS-03
    nome: Workbook PMBOK 8 — Fundamentos
    ids: WB-02 a WB-13 (12 domínios)
    estado: não recebido
    conflito: Instrumento ainda não enviado.
  - id: INS-04
    nome: Q&A Consequente
    ids: QA-05, QA-06, QA-07, QA-08
    estado: derivável
    conflito: Deriva dos domínios predecessores; o PDF Fundamentos PMBOK 8 já fornece a matéria-prima
      (7 domínios, ordem de processo, mapa mental, prioridade).
  - id: INS-05
    nome: Strategic Analysis Agent Runner
    ids: SA-01 a SA-13 (13 frameworks) × 8 unidades ECO = 104 execuções
    estado: runner recebido (ZIP), sem dados de entrada
    conflito: O runner exige entrada JSONL com record_id/text/source_type; a base C01–C18 (214 arquivos)
      ainda não foi enviada.
  unidades_eco:
  - ECO-01 SAS / App EXECUTAR
  - ECO-02 Blog Risco Cognitivo
  - ECO-03 Framework e Metodologia
  - ECO-04 Produtos Físicos
  - ECO-05 Infoprodutos
  - ECO-06 Livro
  - ECO-07 Serviços de Consultoria
  - ECO-08 Ecossistema Creator
  base_documental_pendente: C01–C18 · 214 arquivos · 18 classificações MECE · 22 tipos documentais (não
    recebidos)
conflitos_registrados:
- id: CONF-01
  campo: '9.4'
  descricao: §03-T1 marca 9.4 como TBD, mas §05 do mesmo bloco enumera cinco dependências estratégicas
    materiais.
  acao: Formalizar o grafo em vez de tratar como ausência de dado.
- id: CONF-02
  campo: '10.1'
  descricao: §03-T1 marca 10.1 como TBD, mas §05-Cronograma traz oito marcos datados entre 07/09/2026
    e 10/01/2027.
  acao: 'Eleger o marco #1 — candidato: Gate de Revisão de 24/10/2026.'
- id: CONF-03
  campo: '10.2'
  descricao: O valor real é "Ciclo Zero", que não consta das opções previstas no formulário original (Editorial
    / Desenvolvimento / Governança).
  acao: Ampliar o domínio de valores do campo.
- id: CONF-04
  campo: escopo INS-01
  descricao: OUT-33 exige 34 IDs do XLS Entrypoint; o formulário fundido tem 122 campos.
  acao: Decisão do owner sobre o escopo de preenchimento.
- id: CONF-05
  campo: calendário
  descricao: 'O cronograma de envio (dias 1–6, 31/08 a 05/09/2026) coexiste com o roadmap do projeto (07/09/2026
    a 10/01/2027). São eixos distintos: preenchimento documental vs. execução do ecossistema.'
  acao: Nenhuma — registrado para evitar leitura equivocada de conflito de datas.
