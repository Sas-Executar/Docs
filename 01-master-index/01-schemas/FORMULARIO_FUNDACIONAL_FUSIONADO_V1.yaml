instrumentos:
  origem: Basedocumental310826.md (31/08/2026) — §02-Preenchimento e §07-Output Requirements
  nota: 'A base documental expande o escopo: o formulário fundido de 17 áreas/122 campos passa a ser UM
    de cinco instrumentos a preencher, e cada um deve ser preenchido por unidade de análise (8 áreas ECO),
    não uma única vez.'
  lista:
  - id: INS-01
    nome: XLS Projeto Entrypoint Expandido (formulário fundido)
    ids: 17 áreas / 122 campos (94 originais + 28 de plugin)
    estado: dias 1 e 2 preenchidos (áreas 8,9,10 e 1,2 = 45 campos)
    conflito: 'OUT-33 da base documental exige apenas 1.1–1.12, 8.1–8.5, 9.1–9.4, 10.1–10.4, 12.1–12.3,
      14.1–14.3, 16.1–16.3 (34 campos). O formulário fundido tem 122. Pendente decisão do owner: preencher
      os 122 ou apenas os 34 do escopo OUT-33.'
  - id: INS-02
    nome: Project Charter PMBOK 8
    ids: PC-01, PC-02, PC-03, PC-04, PC-05A, PC-05B, PC-05C, PC-07
    estado: recebido — instrumento entregue
    conflito: ''
    nota: O owner confirmou (31/08/2026) que o instrumento PMBOK 8 enviado é o PDF "01 · Fundamentos PMBOK
      8 · Conceito, Perguntas e Ordem Mental" (sha256:db8133ed…dea5). Ele fornece os 6 princípios, os
      7 domínios de desempenho, a ordem mental (VALOR → SUCESSO → GOVERNANÇA → STAKEHOLDERS → ESCOPO →
      ABORDAGEM → PLANO → RECURSOS → FINANÇAS → RISCO → EXECUÇÃO → MONITORAMENTO → ENCERRAMENTO), as Focus
      Areas (Iniciar→Planejar→Executar→Monitorar→Encerrar) e a hierarquia de prioridade gerencial.
  - id: INS-03
    nome: Workbook PMBOK 8 — Fundamentos
    ids: WB-02 a WB-13 (12 domínios)
    estado: É ENTREGA, não insumo
    conflito: ''
    nota: 'Decisão do owner (31/08/2026): o Workbook PMBOK 8 é o que será ENTREGUE ao final, consolidando
      as principais informações do ecossistema. Deixa de ser instrumento de entrada pendente e passa a
      ser o artefato final (tarefa #8).'
  - id: INS-04
    nome: Q&A Consequente
    ids: QA-05, QA-06, QA-07, QA-08
    estado: derivável
    conflito: Deriva dos domínios predecessores; o PDF Fundamentos PMBOK 8 já fornece a matéria-prima
      (7 domínios, ordem de processo, mapa mental, prioridade).
  - id: INS-05
    nome: Strategic Analysis Agent Runner
    ids: SA-01 a SA-13 (13 frameworks) × 8 unidades ECO = 104 execuções
    estado: runner recebido + base documental localizada no Drive
    conflito: ''
    nota: Os 214 arquivos estão no Drive do owner. Registro documental (215 linhas) em REGISTRO_DOCUMENTAL_MECE_V1.csv
      · fileId 18m6AP55bCyxGNHcMjEiemaut7P339IXY, pasta 00_REGISTRO_DOCUMENTAL_MECE · 1Rx-RKEg7mdoMz84yBItDjxx4_i6yVHYp,
      junto de TAXONOMIA, SCHEMA e RESUMO_EXECUTIVO_MACRO.
