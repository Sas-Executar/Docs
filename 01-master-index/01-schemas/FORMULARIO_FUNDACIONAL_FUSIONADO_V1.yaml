conflitos_registrados:
- id: CONF-01
  campo: '9.4'
  descricao: §03-T1 marca 9.4 como TBD, mas §05 do mesmo bloco enumera cinco dependências estratégicas
    materiais.
  acao: Formalizar o grafo em vez de tratar como ausência de dado.
- id: CONF-02
  campo: '10.1'
  descricao: §03-T1 marca 10.1 como TBD, mas §05-Cronograma traz oito marcos datados entre 07/09/2026
    e 10/01/2027.
  acao: 'Eleger o marco #1 — candidato: Gate de Revisão de 24/10/2026.'
- id: CONF-03
  campo: '10.2'
  descricao: O valor real é "Ciclo Zero", que não consta das opções previstas no formulário original (Editorial
    / Desenvolvimento / Governança).
  acao: Ampliar o domínio de valores do campo.
- id: CONF-04
  campo: escopo INS-01
  descricao: OUT-33 exige 34 IDs do XLS Entrypoint; o formulário fundido tem 122 campos.
  acao: Decisão do owner sobre o escopo de preenchimento.
  resolucao: 'Decisão operacional do Maestro, na ausência de instrução contrária: preencher os 122 campos
    do formulário fundido, que é superconjunto dos 34 IDs exigidos por OUT-33 (1.1–1.12, 8.1–8.5, 9.1–9.4,
    10.1–10.4, 12.1–12.3, 14.1–14.3, 16.1–16.3). Assim nenhum ID obrigatório de OUT-33 fica de fora (OUT-69)
    e o excedente permanece rastreável. Reversível se o owner pedir escopo estrito.'
- id: CONF-05
  campo: calendário
  descricao: 'O cronograma de envio (dias 1–6, 31/08 a 05/09/2026) coexiste com o roadmap do projeto (07/09/2026
    a 10/01/2027). São eixos distintos: preenchimento documental vs. execução do ecossistema.'
