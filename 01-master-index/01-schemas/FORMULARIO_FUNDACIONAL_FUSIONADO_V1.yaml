  - field_id: '2.6'
    title: Critérios de aceite
    description: Como se prova, de forma objetiva, que um requisito foi cumprido.
    example: 'Ex: Artigo real publicado ponta a ponta sem edição manual de TypeScript.'
    origem: formulario_original
    valor: 'Critérios de aceite existem em cinco camadas. (a) DoD editorial do GTM: “texto aprovado +
      assets presentes + CTA funcional + brinde funcional + CMS carregado + SEO preenchido + links testados
      + publicação/agendamento confirmado + evidência registrada”, sobre a cadeia de pacote “conteúdo
      → assets → CTA → brinde → destino → CMS → distribuição → agendamento → tracking → evidência = DONE”.
      (b) Critérios de lançamento de 05/09 (dez itens): páginas críticas abrem em celular e computador;
      todas as chamadas chegam ao destino correto; formulários recebem respostas; ofertas digitais estão
      cadastradas; ligações de afiliado estão identificadas; peças editoriais publicadas ou agendadas;
      demonstrações acessíveis; materiais para redes agendados; medição básica funcionando; não existe
      entrega crítica aguardando produção. (c) DoD técnico verificado: typecheck limpo, bun run check
      limpo, 51/51 testes vitest, 347/347 testes de governança e 3/3 checks de CI verdes por PR. (d) DoD
      do site/CMS: “Abrir /admin → criar artigo → escrever/colar → categorizar → inserir imagem → preencher
      SEO → ver palavras/parágrafos → preview → publicar, sem editar código.” (e) Critério de conclusão
      do ECO-02: “Artigo 1.200–1.800 palavras publicado, landing disponível, CTA editorial funcionando
      e cronograma D1–D14 iniciado.” Princípio de produto que rege todos: “DONE deve ser uma transição
      verificável, não uma sensação de conclusão.”'
