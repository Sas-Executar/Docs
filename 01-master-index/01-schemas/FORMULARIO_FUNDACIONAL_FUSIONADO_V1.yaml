  - field_id: '2.5'
    title: Requisitos funcionais (FRD)
    description: Lista testável do que o sistema deve fazer.
    example: 'Ex: Sistema deve gerar PR automaticamente a partir de um briefing preenchido.'
    origem: formulario_original
    valor: 'Requisitos funcionais existem em dois níveis. (a) Componentes sistêmicos derivados da compensação
      (DOC-C05-001, item 16): “memória externa persistente, decomposição assistida, motor de prioridade,
      próxima ação, contexto persistente, throughput observado, sistema temporal, grafo de dependências,
      progresso automático, DoD e retomada de estado”; automações (item 18): “recalcular prioridades,
      filtrar elegibilidade, preservar contexto, atualizar progresso e selecionar a próxima ação”. Regras
      do motor: dependências, tempo, WIP e ciclo definem elegibilidade; Flow Score e Context Score ordenam
      as alternativas válidas; Progress Points registram somente trabalho efetivamente concluído. (b)
      Requisitos já implementados e verificáveis (DOC-C04-002): rota /scanner com reconhecimento de forma,
      sem QR, dos cinco símbolos administrativos entrada | copiloto | seletor | feito | saída; resolverPayloadScanner(payload);
      idempotencyKeyScanner com bucket de 10s contra duplo-scan acidental; Undo com janela de 8s restaurando
      o EstadoOperacional anterior via expectedRevision (concorrência otimista); rota /mapa-os com projetarMapaOS
      — projeção pura, “nenhum estado novo” — nos formatos prisma (A4 retrato) e tripé (A4 paisagem);
      primitivo concluirPorGestoHumano, que ignora requireDod, requireEvidence, requireHumanApproval e
      requireVerification mesmo sob POLITICA_CONCLUSAO_PADRAO, mas apenas para gesto humano direto e mantendo
      registro auditável no event log; toda mutação oficial passa por executarFerramenta, com idempotência
      e replay via run-ledger. (c) Requisitos de UX derivados das decisões PROD-05 e PROD-09…PROD-13:
      uma única próxima ação principal explícita; nos primeiros segundos mostrar estado atual, resultado
      necessário e próxima ação; persistir contexto e posição de execução para retomada; interromper apenas
      por evento crítico; exigir confirmação só em ações irreversíveis.'
