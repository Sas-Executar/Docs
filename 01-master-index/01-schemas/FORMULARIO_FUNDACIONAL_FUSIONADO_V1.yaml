  - field_id: '2.10'
    title: Jornada — Uso recorrente
    description: O que traz o usuário de volta, sessão após sessão.
    example: 'Ex: Fluxo semanal de briefing → preview → aprovação.'
    origem: formulario_original
    valor: 'O uso recorrente é desenhado como uso deliberadamente baixo — e isso é assumido como hipótese,
      não como fato. Promessa: “uso mínimo do app — cerca de 1–2 vezes por semana”; princípio: “o usuário
      não estrutura, organiza ou prioriza; o usuário visualiza, acompanha e administra”. O Diferencial
      03 registra explicitamente que “a superioridade específica do analógico e a frequência ideal de
      ‘1–2 vezes por semana’ permanecem hipóteses de produto/design, não resultados empiricamente demonstrados
      nos documentos”. O loop operacional recorrente está demonstrado pelo Agente 007: “/bomdia → reconstruir
      estado → mostrar trabalho atual” e a sequência “/bomdia → /agora → execução → evidência → /fechardia
      → /estado → replanejamento”. Métricas de recorrência especificadas: coortes W1/W2/W4/W8, execution_cycles_per_week,
      last_value_event_at e renewed_at. No plano físico, o Mapa-OS existe para sustentar o trabalho fora
      da tela: “Seu sistema de execução não precisa viver na tela para continuar sustentando o trabalho.”
      ECO-07 tem recorrência contratual própria: manutenção programada em 10/20/30 dias, com expansão
      tratada como novo projeto.'
    status: parcial
    tipo_informacao: hipotese
    confianca: media
    eco_unit: ECO-01 (com recorrência contratual própria em ECO-07)
    documento_ids:
