  - field_id: '2.9'
    title: Jornada — Ativação
    description: O primeiro momento em que o usuário obtém valor real.
    example: 'Ex: Primeira publicação aprovada e no ar via QR code físico.'
    origem: formulario_original
    valor: 'A ativação está definida com precisão no ECO-01 pelo VALUE_EVENT-01: “Projeto real → contexto
      interpretado → próxima ação válida → ação executada → conclusão/evidência registrada”. Os eventos
      de telemetria que a marcam são activated_at e first_value_at. As decisões que governam os primeiros
      minutos: PROD-12 — “Nos primeiros segundos, mostrar estado atual, resultado necessário e próxima
      ação — não o projeto inteiro”; PROD-09 — “A interface deve tornar explícita uma única próxima ação
      principal”; PROD-08 — “Usar perguntas de auto-observação e funcionamento cotidiano; proibir triagem
      diagnóstica baseada em um único teste, score ou tarefa do app”; PROD-05 — reduzir densidade simultânea
      de informação. Tecnicamente, o app é local-first (hidrata de localStorage via chaveOrganizacao +
      restaurarEstado), o que remove exigência de credenciais ou servidor para o primeiro uso. ECO-07
      tem ativação própria: D0 formulário visual de 5 minutos → D1 conversa + desenho da solução ao vivo
      → D4 protótipo funcional → D6 entrega + onboarding.'
