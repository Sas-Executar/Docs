agent_rules:

  source_of_truth:
    rule: >
      Um requisito, decisão ou status deve possuir apenas uma origem canônica;
      outros documentos referenciam o ID e não duplicam silenciosamente seu conteúdo.

  traceability:
    rule: >
      Todo requisito implementável deve possuir source, owner, priority,
      acceptance criteria, verification method e evidence.

  conflict_resolution:
    priority:
      - applicable_law
      - approved_business_requirement
      - approved_stakeholder_requirement
      - approved_solution_requirement
      - approved_architecture_decision
      - implementation_plan
      - implementation
    action: >
      Quando duas fontes entrarem em conflito, não escolher silenciosamente;
      registrar conflito, autoridade das fontes e decisão de resolução.

  requirements:
    atomic: true
    testable: true
    uniquely_identified: true
    traceable: true
    measurable_when_possible: true

  decision_records:
    required_for:
      - architecture_change
      - scope_change
      - requirement_override
      - technology_selection
      - security_exception
      - compliance_exception
      - launch_exception
      - retirement_decision

  evidence:
    required_for:
      - validation
      - verification
      - compliance
      - security
      - accessibility
      - quality
      - launch_readiness

  no_document_for_document_sake:
    rule: >
      O card representa uma obrigação de informação e decisão;
      ele não obriga a existência de um arquivo separado quando o conteúdo
      puder ser mantido com clareza e rastreabilidade em outro artefato.

  lifecycle:
    states:
      - draft
      - evidence_pending
      - review
      - approved
      - implementation
      - verified
      - operational
      - superseded
      - retired

final_acceptance:
  ecosystem_is_launchable_when:
    - business_case_approved
    - market_and_customer_evidence_sufficient
    - portfolio_defined
    - applicable_offer_requirements_defined
    - stakeholder_requirements_traced
    - solution_requirements_baselined
    - architecture_approved
    - implementation_complete_for_launch_scope
    - verification_and_validation_passed
    - legal_and_compliance_obligations_satisfied
    - operational_support_ready
    - security_privacy_and_continuity_ready
    - GTM_ready
    - residual_risks_explicitly_accepted
    - launch_decision_record_approved