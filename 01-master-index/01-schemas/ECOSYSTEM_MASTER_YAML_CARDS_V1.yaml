phases:

  # =========================================================
  # P00 — GOVERNANÇA
  # =========================================================

  - id: P00_GOVERNANCE
    name: Governança e controle

    cards:

      - id: GOV-001
        artifact: Ecosystem Charter
        authority: custom_master
        required: yes
        purpose: Definir visão, fronteiras, componentes e mandato do ecossistema.
        depends_on: []
        contains:
          - vision
          - purpose
          - scope
          - ecosystem_components
          - out_of_scope
          - success_definition
          - sponsor
        basis: [S01, S03]

      - id: GOV-002
        artifact: Document and Configuration Governance
        authority: professional_practice
        required: yes
        purpose: Definir source of truth, taxonomia, versões, aprovações e controle de mudanças.
        depends_on: [GOV-001]
        contains:
          - repository
          - document_taxonomy
          - naming_rules
          - versioning
          - status_model
          - approval_rules
          - change_rules
          - retention
        basis: [S01, S02, S03, S05]

      - id: GOV-003
        artifact: Stakeholder and Decision Rights Register
        authority: professional_standard
        required: yes
        purpose: Identificar stakeholders, responsabilidades, autoridade e direitos decisórios.
        depends_on: [GOV-001]
        contains:
          - stakeholder
          - need
          - influence
          - responsibility
          - decision_authority
          - escalation
          - RACI_or_equivalent
        basis: [S03, S05]

      - id: GOV-004
        artifact: Compliance and Legal Obligations Register
        authority: legal_regulatory
        required: yes
        purpose: Registrar leis, contratos, licenças, regulações, padrões adotados e evidências obrigatórias.
        depends_on: [GOV-001, GOV-003]
        contains:
          - jurisdiction
          - obligation
          - applicability
          - owner
          - deadline
          - required_evidence
          - status
        basis: [S21, S25]

      - id: GOV-005
        artifact: Risk Assumption Issue and Constraint Register
        authority: professional_standard
        required: yes
        purpose: Centralizar riscos, premissas, problemas e restrições do ecossistema.
        depends_on: [GOV-001, GOV-003]
        contains:
          - risks
          - assumptions
          - issues
          - constraints
          - probability
          - impact
          - owner
          - response
          - trigger
        basis: [S06, S03, S05]

  # =========================================================
  # P01 — ESTRATÉGIA
  # =========================================================

  - id: P01_STRATEGY
    name: Estratégia e caso de negócio

    cards:

      - id: STR-010
        artifact: Current State Assessment
        authority: professional_standard
        required: yes
        purpose: Estabelecer baseline do negócio, capacidades, processos, ativos e limitações atuais.
        depends_on: [GOV-001, GOV-003]
        contains:
          - baseline
          - current_capabilities
          - current_processes
          - assets
          - pain_points
          - limitations
          - evidence
        basis: [S03, S04]

      - id: STR-011
        artifact: Problem and Opportunity Definition
        authority: professional_standard
        required: yes
        purpose: Formalizar problema, oportunidade, atores afetados, impacto e evidências.
        depends_on: [STR-010]
        contains:
          - problem
          - opportunity
          - affected_stakeholders
          - evidence
          - impact
          - urgency
        basis: [S03]

      - id: STR-012
        artifact: Future State and Strategic Outcomes
        authority: professional_standard
        required: yes
        purpose: Definir estado futuro, capacidades necessárias e resultados mensuráveis.
        depends_on: [STR-011]
        contains:
          - future_state
          - strategic_outcomes
          - required_capabilities
          - constraints
          - success_measures
        basis: [S03, S05]

      - id: STR-013
        artifact: Business Case
        authority: industry_and_professional
        required: yes
        purpose: Demonstrar viabilidade e justificar investimento entre alternativas.
        depends_on: [STR-010, STR-011, STR-012, GOV-005]
        contains:
          - alternatives
          - benefits
          - costs
          - risks
          - time_horizon
          - assumptions
          - recommendation
          - decision
        basis: [S03, S05]

      - id: STR-014
        artifact: BRD
        full_name: Business Requirements Document
        authority: industry_artifact
        required: yes
        purpose: Traduzir estratégia e business case em requisitos de negócio.
        depends_on: [STR-012, STR-013]
        contains:
          - business_goals
          - business_requirements
          - outcomes
          - KPIs
          - constraints
          - assumptions
          - acceptance
        basis: [S03, S02, S26]

      - id: STR-015
        artifact: Strategy and KPI Map
        authority: industry_and_professional
        required: yes
        purpose: Conectar objetivos estratégicos, métricas, metas e iniciativas.
        depends_on: [STR-012, STR-014]
        contains:
          - objectives
          - KPIs
          - targets
          - leading_indicators
          - lagging_indicators
          - owner
        basis: [S03, S05]

  # =========================================================
  # P02 — MERCADO E CLIENTE
  # =========================================================

  - id: P02_MARKET_CUSTOMER
    name: Mercado e cliente

    cards:

      - id: MKT-020
        artifact: Market Research Dossier
        authority: industry_practice
        required: yes
        purpose: Consolidar evidências sobre mercado, segmentos, tamanho, tendências e barreiras.
        depends_on: [STR-011, STR-012]
        contains:
          - market_definition
          - segmentation
          - market_size
          - trends
          - drivers
          - barriers
          - evidence_sources
        basis: [S26]

      - id: MKT-021
        artifact: MRD
        full_name: Market Requirements Document
        authority: industry_artifact
        required: yes
        purpose: Converter evidências de mercado em necessidades e requisitos mercadológicos.
        depends_on: [MKT-020]
        contains:
          - target_market
          - market_needs
          - segments
          - competition
          - differentiators
          - market_constraints
          - market_success
        basis: [S26]

      - id: MKT-022
        artifact: Customer and User Research
        authority: industry_and_hcd
        required: yes
        purpose: Investigar necessidades, contextos, comportamentos e problemas reais de clientes e usuários.
        depends_on: [MKT-020, GOV-003]
        contains:
          - research_questions
          - methodology
          - participants
          - contexts
          - findings
          - evidence
          - limitations
        basis: [S10, S03, S26]

      - id: MKT-023
        artifact: ICP Personas and Jobs-to-be-Done
        authority: industry_practice
        required: yes
        purpose: Formalizar clientes-alvo, usuários, jobs, dores, ganhos e contextos.
        depends_on: [MKT-021, MKT-022]
        contains:
          - ICP
          - personas
          - jobs
          - pains
          - gains
          - contexts
          - exclusions
        basis: [S10, S26]

      - id: MKT-024
        artifact: Competitive Landscape and Positioning
        authority: industry_practice
        required: yes
        purpose: Definir concorrência, alternativas, categoria, diferenciação e posicionamento.
        depends_on: [MKT-020, MKT-021, MKT-023]
        contains:
          - competitors
          - substitutes
          - alternatives
          - comparison_dimensions
          - category
          - positioning
          - proof_points
        basis: [S26]

  # =========================================================
  # P03 — MODELO DE NEGÓCIO E PORTFÓLIO
  # =========================================================

  - id: P03_BUSINESS_PORTFOLIO
    name: Modelo de negócio e portfólio

    cards:

      - id: BUS-030
        artifact: Business Model
        authority: industry_practice
        required: yes
        purpose: Definir como o ecossistema cria, entrega e captura valor.
        depends_on: [STR-013, MKT-021, MKT-023, MKT-024]
        contains:
          - value_propositions
          - customer_segments
          - channels
          - customer_relationships
          - key_resources
          - key_activities
          - key_partners
          - cost_structure
          - revenue_streams
        basis: [S26]

      - id: BUS-031
        artifact: Financial Model and Funding Plan
        authority: professional_practice
        required: yes
        purpose: Quantificar receitas, custos, caixa, investimento, runway e cenários de viabilidade.
        depends_on: [BUS-030, STR-013]
        contains:
          - revenue_forecast
          - fixed_costs
          - variable_costs
          - cash_flow
          - investment
          - runway
          - break_even
          - scenarios
          - assumptions
        basis: [S05, S26]

      - id: BUS-032
        artifact: Pricing and Packaging Strategy
        authority: industry_practice
        required: yes
        purpose: Definir preços, planos, bundles, descontos e regras de monetização.
        depends_on: [BUS-030, BUS-031, MKT-024]
        contains:
          - pricing_model
          - packages
          - bundles
          - discounts
          - margin_targets
          - tax_assumptions
          - pricing_experiments
        basis: [S26]

      - id: BUS-033
        artifact: Brand and Messaging Strategy
        authority: industry_practice
        required: yes
        purpose: Definir arquitetura de marca, promessa, identidade, voz e sistema de mensagens.
        depends_on: [MKT-023, MKT-024, BUS-030]
        contains:
          - brand_architecture
          - promise
          - positioning
          - voice
          - identity_principles
          - message_house
          - claims
        basis: [S26, S25]

      - id: BUS-034
        artifact: Portfolio and Offer Architecture
        authority: custom_integration
        required: yes
        purpose: Integrar todas as ofertas do ecossistema em uma arquitetura única.
        depends_on: [BUS-030, BUS-032, BUS-033]
        contains:
          - offer_catalog
          - application
          - digital_products
          - physical_products
          - services
          - editorial
          - free_offers
          - paid_offers
          - entry_offer
          - core_offer
          - expansion_offers
          - bundles
          - cross_sell
          - lifecycle
        basis: [S01, S26]

      - id: BUS-035
        artifact: Ecosystem Capability Value Stream and Dependency Map
        authority: custom_integration
        required: yes
        purpose: Mostrar capacidades, fluxos de valor, recursos e dependências necessários para operar o portfólio.
        depends_on: [STR-014, BUS-034]
        contains:
          - capabilities
          - value_streams
          - systems
          - people
          - suppliers
          - partners
          - dependencies
          - critical_capabilities
        basis: [S03, S04, S01]

  # =========================================================
  # P04 — DEFINIÇÃO DAS OFERTAS
  # =========================================================

  - id: P04_OFFER_DEFINITION
    name: Definição das ofertas

    cards:

      - id: OFF-040
        artifact: PRD Application
        authority: industry_artifact
        required: conditional
        applies_if: software_application_exists
        purpose: Definir o que o aplicativo precisa entregar para usuário e negócio.
        depends_on: [BUS-034, MKT-023, STR-014]
        contains:
          - problem
          - users
          - scope
          - out_of_scope
          - journeys
          - features
          - business_rules
          - priorities
          - metrics
          - acceptance
        basis: [S02, S03, S26]

      - id: OFF-041
        artifact: PRD Digital Products
        authority: industry_artifact
        required: conditional
        applies_if: digital_products_exist
        purpose: Definir requisitos de cursos, ebooks, templates, downloads ou produtos digitais equivalentes.
        depends_on: [BUS-034, MKT-023, STR-014]
        contains:
          - audience
          - transformation
          - format
          - modules
          - content
          - delivery
          - access
          - support
          - monetization
          - acceptance
        basis: [S02, S26]

      - id: OFF-042
        artifact: Physical Product Requirements
        authority: systems_engineering_artifact
        required: conditional
        applies_if: physical_products_exist
        purpose: Definir finalidade, forma, materiais, ergonomia, segurança, produção e aceitação dos produtos físicos.
        depends_on: [BUS-034, MKT-023, STR-014]
        contains:
          - use_case
          - dimensions
          - materials
          - ergonomics
          - safety
          - durability
          - packaging
          - manufacturability
          - acceptance
        basis: [S01, S02, S07]

      - id: OFF-043
        artifact: Service Requirements and Service Blueprint
        authority: industry_and_standard
        required: conditional
        applies_if: services_exist
        purpose: Definir promessa, jornada, frontstage, backstage, recursos, SLA e entregáveis dos serviços.
        depends_on: [BUS-034, MKT-023, STR-014]
        contains:
          - service_outcome
          - customer_journey
          - touchpoints
          - frontstage
          - backstage
          - supporting_processes
          - resources
          - SLA
          - deliverables
          - acceptance
        basis: [S01, S18, S07]

      - id: OFF-044
        artifact: Editorial and Content Strategy
        authority: industry_practice
        required: conditional
        applies_if: editorial_operation_exists
        purpose: Definir tese editorial, audiência, pilares, formatos, evidência, distribuição e conversão.
        depends_on: [BUS-033, BUS-034, MKT-023]
        contains:
          - editorial_thesis
          - audience
          - pillars
          - formats
          - channels
          - evidence_policy
          - editorial_policy
          - calendar_logic
          - distribution
          - CTA
          - metrics
        basis: [S26, S25]

      - id: OFF-045
        artifact: Commerce Channel and Customer Lifecycle Requirements
        authority: custom_integration
        required: yes
        purpose: Definir aquisição, checkout, pagamento, entrega, CRM, retenção, devolução e relacionamento.
        depends_on: [BUS-032, BUS-034, BUS-035]
        contains:
          - acquisition_channels
          - commerce_channels
          - checkout
          - payment
          - taxation
          - fulfillment
          - CRM
          - onboarding
          - retention
          - cancellation
          - returns
        basis: [S01, S03, S25, S26]

  # =========================================================
  # P05 — REQUISITOS
  # =========================================================

  - id: P05_REQUIREMENTS
    name: Engenharia de requisitos

    cards:

      - id: REQ-050
        artifact: Stakeholder Requirements Specification
        authority: normative_concept
        required: yes
        purpose: Traduzir necessidades dos stakeholders em requisitos explícitos e rastreáveis.
        depends_on:
          - GOV-003
          - STR-014
          - OFF-040
          - OFF-041
          - OFF-042
          - OFF-043
          - OFF-044
          - OFF-045
        contains:
          - stakeholder_id
          - need
          - requirement
          - rationale
          - priority
          - acceptance
          - trace
        basis: [S02, S03]

      - id: REQ-051
        artifact: Solution Requirements SRS Master
        authority: normative_and_industry
        required: yes
        purpose: Criar baseline mestre de requisitos da solução para todos os componentes do ecossistema.
        depends_on: [REQ-050]
        contains:
          - requirement_id
          - requirement_type
          - statement
          - rationale
          - source
          - priority
          - verification_method
          - acceptance
          - trace
        basis: [S02, S03]

      - id: REQ-052
        artifact: FRD
        full_name: Functional Requirements Document
        authority: industry_artifact
        required: conditional
        applies_if: behavioral_solution_components_exist
        purpose: Especificar comportamentos, funções, fluxos, regras, entradas, saídas e exceções.
        depends_on: [REQ-051]
        contains:
          - actors
          - triggers
          - preconditions
          - functional_behavior
          - normal_flows
          - alternative_flows
          - business_rules
          - outputs
          - exceptions
          - acceptance
        basis: [S02, S03, S26]

      - id: REQ-053
        artifact: NFR and Quality Requirements
        authority: normative_concept
        required: yes
        purpose: Especificar atributos de qualidade e níveis mensuráveis de serviço.
        depends_on: [REQ-051]
        contains:
          - performance
          - reliability
          - availability
          - security
          - usability
          - maintainability
          - compatibility
          - portability
          - scalability
          - measurable_thresholds
        basis: [S02, S03, S08]

      - id: REQ-054
        artifact: Transition Requirements
        authority: normative_concept
        required: yes
        purpose: Definir capacidades temporárias necessárias para migrar do estado atual ao futuro.
        depends_on: [STR-010, STR-012, REQ-051]
        contains:
          - migration
          - conversion
          - training
          - cutover
          - parallel_operation
          - continuity
          - decommissioning
        basis: [S03, S01]

      - id: REQ-055
        artifact: Data Analytics and Governance Requirements
        authority: normative_and_professional
