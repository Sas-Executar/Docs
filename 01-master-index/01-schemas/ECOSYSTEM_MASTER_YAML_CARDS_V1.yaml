schema: ECOSYSTEM_MASTER_YAML_CARDS_V1
language: pt-BR

scope:
  description: >
    Lançamento, operação, evolução e retirada de um ecossistema composto
    por negócio, aplicativo/software, operação editorial, produtos digitais,
    produtos físicos e serviços.

completeness:
  claim: >
    Modelo de cobertura completa para este escopo; não representa um cânone
    universal que obrigue organizações a utilizar exatamente estes nomes de documentos.
  rule: >
    Cards podem ser combinados ou implementados no mesmo documento somente quando
    ownership, rastreabilidade, dependências, requisitos, decisões, evidências
    e critérios de aceitação permanecerem explícitos.
  unit_of_control: YAML_CARD
  total_phases: 12
  total_cards: 75

dependency_semantics:
  depends_on: >
    Predecessores lógicos que devem existir em nível suficiente de maturidade
    antes de o card dependente ser congelado ou aprovado.
  required_yes: >
    Componente estrutural do sistema documental.
  required_conditional: >
    Torna-se obrigatório quando a condição indicada em applies_if existir.
  concurrency: >
    Cards sem dependência direta podem evoluir paralelamente.
  iteration: >
    Cards podem retornar a estados anteriores quando novas evidências invalidarem
    premissas ou decisões.
  traceability_direction:
    - need
    - business_requirement
    - stakeholder_requirement
    - solution_requirement
    - design
    - implementation
    - verification
    - evidence
    - operational_result

authority_model:
  normative_standard: Norma publicada.
  normative_guidance: Norma ou orientação normativa.
  professional_standard: Padrão profissional reconhecido.
  framework_standard: Framework formal reconhecido.
  government_framework: Framework governamental reconhecido.
  legal_regulatory: Obrigação dependente da jurisdição ou setor.
  industry_artifact: Artefato comum da indústria, mas não universalmente obrigatório.
  industry_practice: Prática recorrente de mercado.
  custom_master: Artefato integrador criado para governar o ecossistema.
  custom_integration: Artefato criado para integrar disciplinas distintas.

